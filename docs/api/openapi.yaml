components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: string
        generated_at:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: integer
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - admin
          - manager
          - specialist
          - viewer
        organization_id:
          type: string
        mfa_enabled:
          type: boolean
        version:
          type: integer
    Employee:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        full_name:
          type: string
        position_id:
          type: string
        status:
          type: string
        version:
          type: integer
    Department:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        archived:
          type: boolean
        version:
          type: integer
    Position:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        version:
          type: integer
    Document:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        title:
          type: string
        status:
          type: string
        source_file_id:
          type: string
        version:
          type: integer
    SourceFile:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        filename:
          type: string
        size:
          type: integer
        checksum:
          type: string
    Page:
      type: object
      properties:
        id:
          type: string
        source_file_id:
          type: string
        number:
          type: integer
        text:
          type: string
    ProcessingJob:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        kind:
          type: string
        status:
          type: string
    AnalysisRun:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
    Finding:
      type: object
      properties:
        id:
          type: string
        analysis_id:
          type: string
        organization_id:
          type: string
        severity:
          type: string
        status:
          type: string
        title:
          type: string
    Recommendation:
      type: object
      properties:
        id:
          type: string
        analysis_id:
